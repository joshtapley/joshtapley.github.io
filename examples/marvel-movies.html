body.tile{padding:0;background:transparent}
body.tile .viz{padding:14px 16px}
body.tile .viz-head{margin-bottom:10px}
/* in a dashboard a tile shows its default view: layout and option switches belong on the component's own demo page */
body.tile .seg,body.tile .viz-head .btn:not(.xl-btn),body.tile .xl-ctl{display:none!important}
html:has(body.tile),body.tile{overflow:hidden}
body.tile .stage{max-width:none}
html:has(body.tile),body.tile,body.tile .stage{height:100%}
body.tile .stage>.viz{min-height:100%}
.stage{max-width:940px;margin:0 auto}
.viz{background:var(--surface);border:1px solid var(--card-line,var(--border));border-radius:var(--radius);padding:18px 20px;box-shadow:var(--card-edge),var(--card-shadow)}
/* card shadows: ?shadow=flat|soft|lifted|float|edge or postMessage({shadow}); flat is the default. Dark mode deepens the shadow and adds a
   faint top highlight, because a dark shadow on a dark page barely shows. In a dashboard the page draws the outer shadow around each tile. */
:root{--card-shadow:0 0 0 0 transparent;--card-edge:0 0 0 0 transparent;--sh-c:16,24,40;--sh-a:1}
:root[data-theme="dark"]{--sh-c:0,0,0;--sh-a:2.6}
:root[data-shadow="soft"]{--card-shadow:0 1px 2px rgba(var(--sh-c),calc(.06*var(--sh-a))),0 1px 3px rgba(var(--sh-c),calc(.1*var(--sh-a)))}
:root[data-shadow="lifted"],:root[data-shadow="edge"]{--card-shadow:0 2px 4px -2px rgba(var(--sh-c),calc(.06*var(--sh-a))),0 8px 18px -6px rgba(var(--sh-c),calc(.14*var(--sh-a)))}
:root[data-shadow="float"]{--card-shadow:0 4px 8px -4px rgba(var(--sh-c),calc(.08*var(--sh-a))),0 18px 40px -12px rgba(var(--sh-c),calc(.24*var(--sh-a)));--card-line:transparent}
:root[data-shadow="edge"]{--card-edge:inset 5px 0 0 var(--s1)}
:root[data-theme="dark"][data-shadow]:not([data-shadow="flat"]){--card-line:color-mix(in srgb,var(--border) 70%,#fff 6%)}
body.tile .viz{box-shadow:var(--card-edge)}
.viz-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.viz-title{font-size:15px;font-weight:600;margin:0;font-family:var(--font-display,var(--font))}
.viz-sub{font-size:13px;color:var(--ink-2);margin:2px 0 0}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
svg{display:block;overflow:visible}
svg text{fill:var(--muted);font:11px var(--font);font-variant-numeric:tabular-nums}
svg text.ink{fill:var(--ink)} svg text.ink2{fill:var(--ink-2)}
/* controls */
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px;gap:2px}
.seg button{all:unset;cursor:pointer;font-size:12px;padding:4px 10px;border-radius:6px;color:var(--ink-2)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--border)}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--s1);outline-offset:1px}
.btn{all:unset;cursor:pointer;font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--border);color:var(--ink-2);background:var(--surface)}
.btn:hover{background:var(--hover);color:var(--ink)}
input[type=search],input[type=text],select{font:13px var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
/* Excel download: an opt-in switch beside the title, and a button whenever a data table is on screen */
.viz-head:has(.xl){justify-content:flex-start} .viz-head:has(.xl)>:first-child{margin-right:auto}
.xl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.xl-ctl{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.xl-btn[hidden]{display:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.delta{font-size:12px;font-weight:600;white-space:nowrap}
.delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--muted)}
/* tooltip */
.v-tip{position:fixed;z-index:50;pointer-events:none;display:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.14);max-width:260px;font-variant-numeric:tabular-nums}
.v-tip b{font-weight:600}
.v-tip .k{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
/* theme toggle (hidden when embedded) */
.theme-bar{position:fixed;top:10px;right:10px;z-index:40;display:flex;gap:6px;align-items:center}
.theme-bar select{font-size:12px;padding:4px 8px;border-radius:8px}
body.embed .theme-bar{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<style>
.cs-ctl label:has(#cs-o-s),.cs-ctl label:has(#cs-o-k),.cs-ctl .cs-end,#cs-note,.theme-bar{display:none!important}
.cs-ctl select{font-size:12px;padding:4px 8px}
.cs-source a{color:inherit;text-decoration:underline}
.ex-back{display:inline-block;margin:0 0 12px;font-size:13px;color:var(--on-page-2,var(--ink-2));text-decoration:none}
.ex-back:hover{color:var(--on-page,var(--ink));text-decoration:underline}
.ex-back:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:2px}
</style>
</head>
<body>
<div class="stage">
<style>
.cs-title{font-size:clamp(21px,3.4vw,30px);line-height:1.15;font-weight:800;letter-spacing:-.01em;margin:0;font-family:var(--font-display,var(--font));text-wrap:balance}
.cs-sub{font-size:clamp(14px,2vw,18px);color:var(--ink-2);margin:4px 0 0}
[contenteditable]{border-radius:4px;outline:0}
[contenteditable]:hover{box-shadow:0 1px 0 0 var(--axis)}
[contenteditable]:focus-visible{box-shadow:0 0 0 2px var(--s1)}
.cs-ctl{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.cs-ctl label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.cs-ctl .cs-end{margin-left:auto;display:flex;gap:6px}
#cs-chart{position:relative;touch-action:pan-y}
#cs-chart text.cs-tick{font:12px var(--font-mono,ui-monospace,"Cascadia Mono",Consolas,monospace);fill:var(--muted)}
#cs-chart text.cs-axis{font-size:14px;font-weight:700;fill:var(--ink-2)}
#cs-chart text.cs-name{font-size:var(--cs-name,20px);font-weight:800;font-family:var(--font-display,var(--font))}
#cs-chart text.cs-call{font-size:13px;fill:var(--ink-2)}
.cs-drag{cursor:grab;touch-action:none}
.cs-drag:active{cursor:grabbing}
.cs-drag:focus{outline:0}
.cs-drag:focus-visible text{text-decoration:underline}
.cs-hit{cursor:pointer}
.cs-edit{position:absolute;z-index:5;font-weight:800;font-size:15px;padding:3px 6px;min-width:130px}
.cs-note{font-size:13px;line-height:1.4;color:var(--ink-2);margin:0 0 10px}
.cs-note b{color:var(--ink)}
.cs-foot{display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px solid var(--border);margin-top:10px;padding-top:8px}
.cs-source{text-transform:uppercase;letter-spacing:.05em}
.cs-panel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;background:var(--surface-2);border-radius:8px;padding:12px;margin-bottom:12px}
.cs-panel[hidden]{display:none}
.cs-panel label{font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px;min-width:0}
.cs-panel .cs-wide{grid-column:1/-1}
.cs-panel input{width:100%}
.cs-panel textarea{width:100%;height:150px;resize:vertical;font:12px/1.45 var(--font-mono,ui-monospace,Consolas,monospace);color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.cs-row{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cs-err{font-size:12px;color:var(--crit)}
.cs-ctl [hidden]{display:none}
.cs-ctl .cs-view{display:inline-flex;align-items:center;padding:5px 8px}
.cs-ctl .cs-view[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);border-color:var(--axis)}
.cs-table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.cs-table th,.cs-table td{padding:5px 10px;text-align:right}
.cs-table th:first-child{text-align:left}
.cs-table thead th{position:sticky;top:0;z-index:1;background:var(--surface);font-size:12px;font-weight:600;color:var(--muted);vertical-align:bottom;border-bottom:2px solid var(--ink-2)}
.cs-table tbody th{font-weight:400;color:var(--ink)}
.cs-table tbody td{color:var(--ink-2)}
.cs-table tbody tr+tr>*{border-top:1px solid var(--grid)}
.cs-table .cs-tgroup>*{padding-top:18px;padding-bottom:6px;border-bottom:1px solid var(--axis)}
.cs-table .cs-tgroup th{font-size:17px;font-weight:800;font-family:var(--font-display,var(--font))}
.cs-table .cs-tgroup td{font-size:12px;font-weight:600}
.cs-tkey{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,transparent)}
.cs-tcount{font-size:12px;font-weight:400;color:var(--muted);font-family:var(--font);margin-left:8px;white-space:nowrap}
.cs-tmed{font-weight:400;color:var(--muted)}
@media (max-width:620px){.cs-panel{grid-template-columns:repeat(2,minmax(0,1fr))}.cs-ctl .cs-end{margin-left:0}}
</style>

<div class="viz">
  <div class="viz-head">
    <div>
      <h2 class="viz-title cs-title" id="cs-title"></h2>
      <p class="viz-sub cs-sub" id="cs-sub"></p>
    </div>
  </div>
  <div class="cs-ctl">
    <label>Sample <span class="seg" id="cs-o-s"></span></label>
    <label>Groups <span class="seg" id="cs-o-k"></span></label>
    <label>Callouts <span class="seg" id="cs-o-c"></span></label>

    const theme = document.createElement("label"); theme.append("Theme ", document.querySelector('.theme-bar select[aria-label="Theme"]'));
    ctl.insertBefore(outline, end); ctl.insertBefore(callouts, end); ctl.insertBefore(theme, end);
    const back = document.createElement("a"); back.className = "ex-back"; back.href = "index.html"; back.textContent = "← Chart examples"; document.querySelector(".stage").prepend(back);
    $id("cs-chart").addEventListener("contextmenu", e => { const dot = e.target.closest("[data-hit]"); if (!dot) return; e.preventDefault(); V.untip(); dot.dispatchEvent(new MouseEvent("click", { bubbles: true })); });
    resetEdits(); recluster(); render();
  });
})();
</script>
</body>
</html>
