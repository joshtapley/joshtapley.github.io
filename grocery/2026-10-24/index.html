<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Grocery list, Sat 10/24</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1d2330}
header{position:sticky;top:0;background:#1f6f5c;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.15rem;margin:0} #count{font-size:.9rem;opacity:.9}
main{padding:8px 12px 80px;max-width:560px;margin:auto}
h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:#5b6475;margin:18px 4px 6px}
ul{list-style:none;margin:0;padding:0;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}
li+li{border-top:1px solid #eceef2}
label{display:flex;align-items:center;gap:14px;padding:14px 16px;font-size:1.05rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{width:24px;height:24px;accent-color:#1f6f5c;flex:none}
input:checked+span{text-decoration:line-through;color:#9aa1ad}
button{display:block;margin:24px auto;padding:10px 18px;border:1px solid #c9ced8;border-radius:8px;background:#fff;font-size:.95rem}
</style></head><body><header><h1>Grocery list, Sat 10/24</h1><span id="count"></span></header><main><section><h2>Produce</h2><ul><li><label><input type="checkbox" data-id="i0"><span>Potatoes</span></label></li><li><label><input type="checkbox" data-id="i1"><span>Carrots</span></label></li><li><label><input type="checkbox" data-id="i2"><span>Onion</span></label></li><li><label><input type="checkbox" data-id="i3"><span>Celery</span></label></li></ul></section><section><h2>Meat</h2><ul><li><label><input type="checkbox" data-id="i4"><span>Beef stew cubes</span></label></li><li><label><input type="checkbox" data-id="i5"><span>Turkey</span></label></li></ul></section><section><h2>Dairy</h2><ul><li><label><input type="checkbox" data-id="i6"><span>Ricotta</span></label></li></ul></section><section><h2>Bakery</h2><ul><li><label><input type="checkbox" data-id="i7"><span>Bread</span></label></li></ul></section><section><h2>Pantry</h2><ul><li><label><input type="checkbox" data-id="i8"><span>Tomato paste</span></label></li><li><label><input type="checkbox" data-id="i9"><span>Beef broth</span></label></li><li><label><input type="checkbox" data-id="i10"><span>Extra virgin olive oil</span></label></li><li><label><input type="checkbox" data-id="i11"><span>Honey</span></label></li><li><label><input type="checkbox" data-id="i12"><span>Sugar</span></label></li><li><label><input type="checkbox" data-id="i13"><span>Buffalo sauce</span></label></li><li><label><input type="checkbox" data-id="i14"><span>Poultry herbs</span></label></li></ul></section><section><h2>Beverages</h2><ul><li><label><input type="checkbox" data-id="i15"><span>Red wine</span></label></li><li><label><input type="checkbox" data-id="i16"><span>Distilled water</span></label></li><li><label><input type="checkbox" data-id="i17"><span>Bottled water</span></label></li></ul></section><section><h2>Non-food</h2><ul><li><label><input type="checkbox" data-id="i18"><span>Padded envelopes</span></label></li><li><label><input type="checkbox" data-id="i19"><span>Cat photos</span></label></li></ul></section><section><h2>Optional, only if out (for beef stew)</h2><ul><li><label><input type="checkbox" data-id="i20"><span>Garlic</span></label></li><li><label><input type="checkbox" data-id="i21"><span>Flour</span></label></li><li><label><input type="checkbox" data-id="i22"><span>Worcestershire sauce</span></label></li><li><label><input type="checkbox" data-id="i23"><span>Bay leaves</span></label></li><li><label><input type="checkbox" data-id="i24"><span>Thyme</span></label></li></ul></section><button id="reset">Uncheck all</button></main>
<script>
const K="grocery-2026-10-24",s=JSON.parse(localStorage.getItem(K)||"{}"),b=[...document.querySelectorAll("input")];
function c(){document.getElementById("count").textContent=b.filter(x=>x.checked).length+" / "+b.length}
b.forEach(x=>{x.checked=!!s[x.dataset.id];x.onchange=()=>{s[x.dataset.id]=x.checked;localStorage.setItem(K,JSON.stringify(s));c()}});
document.getElementById("reset").onclick=()=>{b.forEach(x=>{x.checked=false;s[x.dataset.id]=false});localStorage.setItem(K,JSON.stringify(s));c()};c();
</script></body></html>
